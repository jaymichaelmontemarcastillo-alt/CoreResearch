services:
  - type: web
    name: coreresearch-api-lspu-40301844
    runtime: node
    plan: free
    rootDir: server
    buildCommand: npm install
    startCommand: npm start
    healthCheckPath: /api/health
    envVars:
      - key: NODE_ENV
        value: production
      - key: CLIENT_ORIGIN
        value: https://coreresearch-33a17.web.app
      - key: FIREBASE_PROJECT_ID
        value: coreresearch-33a17
      - key: MATCHING_PROVIDER
        value: gemini
      - key: GEMINI_API_KEY
        sync: false
      - key: FIREBASE_PRIVATE_KEY
        sync: false
      - key: FIREBASE_CLIENT_EMAIL
        sync: false
