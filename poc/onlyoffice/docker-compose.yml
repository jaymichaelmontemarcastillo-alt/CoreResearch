version: '3'
services:
  onlyoffice-document-server:
    image: onlyoffice/documentserver:latest
    container_name: onlyoffice-docs-poc
    ports:
      - "8080:80"
    environment:
      - JWT_ENABLED=false # Disabled for POC simplicity
    volumes:
      - document_data:/var/www/onlyoffice/Data
      - document_log:/var/log/onlyoffice
volumes:
  document_data:
  document_log:
