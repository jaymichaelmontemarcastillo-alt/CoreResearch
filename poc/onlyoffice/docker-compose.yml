version: '3'
services:
  onlyoffice:
    image: onlyoffice/documentserver:latest
    container_name: onlyoffice_poc
    ports:
      - "8080:80"
    environment:
      - JWT_SECRET=${ONLYOFFICE_JWT_SECRET:?Set ONLYOFFICE_JWT_SECRET before starting ONLYOFFICE}
      - JWT_ENABLED=true
    restart: always
